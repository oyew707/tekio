[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tekio"
version = "0.1.0"
description = "Vision-grounded browser-use agent scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
  "playwright>=1.46.0",
  "streamlit>=1.37.0",
  "psycopg[binary]>=3.2.0",
  "pgvector>=0.3.2",
  "pika>=1.3.2",
  "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*", "worker*"]
