services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tekio
      POSTGRES_USER: tekio
      POSTGRES_PASSWORD: tekio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  chromium:
    image: chromedp/headless-shell:latest
    container_name: chromium
    shm_size: '1gb'          # avoids crashes from Docker's tiny default /dev/shm
    command:
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --disable-gpu
    ports:
      - "9222:9222"

  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp
    container_name: playwright-mcp
    restart: unless-stopped
    depends_on:
      - chromium
    environment:
      - ALLOWED_HOSTS=playwright-mcp,localhost,*
      - ALLOWED_ORIGINS=*
    entrypoint: ["node", "/app/cli.js"]
    command:
      - --cdp-endpoint=http://chromium:9222
      - --port=8931
      - --host=0.0.0.0
    ports:
      - "8931:8931"

  app:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
    env_file:
      - .env
    depends_on:
      - postgres
      - rabbitmq
    command: >
      sh -c "pip install -r requirements.txt && PYTHONPATH=. streamlit run frontend/streamlit_app.py --server.address=0.0.0.0 --server.port=8501"
    ports:
      - "8501:8501"

volumes:
  pgdata: