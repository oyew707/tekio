networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tekio
      POSTGRES_USER: tekio
      POSTGRES_PASSWORD: tekio
    ports:
      - "5432:5432"
    volumes:
      - pgdata_v2:/var/lib/postgresql/data
      - ./rag/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  chromium:
    image: chromedp/headless-shell:latest
    container_name: chromium
    shm_size: '1gb'
    restart: unless-stopped
    command:
      - --window-size=1280,720
    networks:
      default:
        ipv4_address: 172.28.0.10
    ports:
      - "9222:9222"

  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp
    container_name: playwright-mcp
    restart: unless-stopped
    depends_on:
      - chromium
    environment:
      - PLAYWRIGHT_MCP_ALLOWED_HOSTS=playwright-mcp,localhost,*
      - PLAYWRIGHT_MCP_ALLOWED_ORIGINS=*
    entrypoint: ["node", "/app/cli.js"]
    volumes:
      - ./playwright-output:/output
    command:
      - --output-dir=/output
      - --caps=vision
      - --cdp-endpoint=http://172.28.0.10:9222
      - --port=8931
      - --host=0.0.0.0
      - --viewport-size=${VIEWPORT_SIZE}
    ports:
      - "8931:8931"

  app:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
    env_file:
      - .env
    depends_on:
      - postgres
      - rabbitmq
    command: >
      sh -c "pip install -r requirements.txt --upgrade && PYTHONPATH=. streamlit run frontend/streamlit_app.py --server.address=0.0.0.0 --server.port=8501"
    ports:
      - "8501:8501"

  queue_consumer:
    build: .
    volumes:
      - ./:/workspace
    depends_on:
      - postgres
      - rabbitmq
    env_file:
      - .env
    command: sh -c "pip install pika psycopg2-binary && python workers/queue_consumer.py"
    restart: unless-stopped

volumes:
  pgdata_v2: